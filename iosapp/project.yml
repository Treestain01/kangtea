name: BBT
options:
  bundleIdPrefix: com.tristanjong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  BBT:
    type: application
    platform: iOS
    sources:
      - path: BBT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristanjong.bbtapp
        PRODUCT_NAME: BBT
        INFOPLIST_FILE: BBT/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
        SUPPORTED_INTERFACE_ORIENTATIONS_IPAD: UIInterfaceOrientationPortrait

  BBTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BBTTests
    dependencies:
      - target: BBT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristanjong.bbtapp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BBT:
    build:
      targets:
        BBT: all
        BBTTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BBTTests
    archive:
      config: Release
